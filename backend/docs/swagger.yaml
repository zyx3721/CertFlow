    get:
      parameters:
      - description: 证书序列号
        in: path
        name: serial
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ocspStatusResponse'
      summary: 查询 OCSP 状态（路径序列号）
      tags:
      - PKI
  /ocsp/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ocspHealthResponse'
      summary: 获取 OCSP 服务状态
      tags:
      - PKI
securityDefinitions:
  BearerAuth:
