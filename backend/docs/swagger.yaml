  /ocsp:
    get:
      description: 通过序列号查询适合浏览器和运维排障使用的 OCSP 状态；服务关闭时返回 unknown 与 ocspDisabled 原因。
      parameters:
      - description: 证书序列号
        in: query
        name: serialNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.ocspStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 查询 OCSP 状态（JSON）
      tags:
      - PKI
    post:
      consumes:
      - application/ocsp-request
      description: 接收 application/ocsp-request 二进制请求，返回由签发 CA 对应的独立 OCSP Responder
        身份签名的二进制响应；服务关闭时返回标准 unauthorized 响应。
      parameters:
      - description: OCSP request bytes
        in: body
        name: body
        required: true
        schema:
          type: string
      produces:
      - application/ocsp-response
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
      summary: RFC 6960 OCSP 状态响应
      tags:
      - PKI
