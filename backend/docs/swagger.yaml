basePath: /
definitions:
  domain.Audit:
    properties:
      action:
        type: string
      detail:
        type: string
      id:
        type: string
      ip:
        type: string
      module:
        type: string
      result:
        type: string
      target:
        type: string
      timestamp:
        type: string
      username:
        type: string
    type: object
  domain.CA:
    properties:
      algorithm:
        type: string
      certificatePem:
        type: string
      id:
        type: string
      issuedCerts:
        type: integer
      name:
        type: string
      notAfter:
        type: string
      notBefore:
        type: string
      parentId:
        type: string
      revokedCerts:
        type: integer
      status:
        type: string
      subject:
        type: string
      type:
        type: string
    type: object
  domain.CRLEntry:
    properties:
      caId:
        type: string
      caName:
        type: string
      commonName:
        type: string
      id:
        type: string
      reason:
        type: string
      revokedAt:
        type: string
      serialNumber:
        type: string
    type: object
  domain.Certificate:
    properties:
      algorithm:
        type: string
      applicant:
        type: string
      caId:
        type: string
      certificatePem:
        type: string
      commonName:
        type: string
      csrPem:
        type: string
      fingerprint:
        type: string
      id:
        type: string
      notAfter:
        type: string
      notBefore:
        type: string
      privateKeyPem:
        type: string
      purpose:
        type: string
      rejectReason:
        type: string
      revokeReason:
        type: string
      revokedAt:
        type: string
      san:
        items:
          type: string
        type: array
      serialNumber:
        type: string
      source:
        type: string
      status:
        type: string
      subject:
        type: string
    type: object
  domain.PasswordResetCaptcha:
    properties:
      expiresAt:
        type: string
      question:
        type: string
      token:
        type: string
    type: object
  domain.Role:
    properties:
      builtin:
        type: boolean
      createdAt:
        type: string
      description:
        type: string
      disabled:
        type: boolean
      id:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
      updatedAt:
        type: string
    type: object
  domain.Session:
    properties:
      expiresAt:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  domain.User:
    properties:
      createdAt:
        type: string
      directRoles:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      disabled:
        type: boolean
      displayName:
        type: string
      email:
        type: string
      id:
        type: string
      lastLoginAt:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      roles:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      source:
        type: string
      updatedAt:
        type: string
      username:
        type: string
    type: object
  domain.UserGroup:
    properties:
      createdAt:
        type: string
      description:
        type: string
      disabled:
        type: boolean
      id:
        type: string
      members:
        items:
          $ref: '#/definitions/domain.User'
        type: array
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      updatedAt:
        type: string
    type: object
  domain.Workflow:
    properties:
      applicant:
        type: string
      certName:
        type: string
      certificateId:
        type: string
      createdAt:
        type: string
      id:
        type: string
      rejectReason:
        type: string
      status:
        type: string
    type: object
  repository.NotificationChannelSetting:
    properties:
      approvalEnabled:
        type: boolean
      config:
        additionalProperties: {}
        type: object
      id:
        type: string
      name:
        type: string
      passwordResetEnabled:
        type: boolean
      updatedAt:
        type: string
    type: object
  router.auditListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Audit'
        type: array
      total:
        type: integer
    type: object
  router.caDeletionCheckResponse:
    properties:
      deletable:
        type: boolean
    type: object
  router.caListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.CA'
        type: array
      total:
        type: integer
    type: object
  router.certificateCSRInspectRequest:
    properties:
      csrPEM:
        type: string
    type: object
  router.certificateCSRInspectResponse:
    properties:
      algorithm:
        type: string
      san:
        items:
          type: string
        type: array
      subject:
        properties:
          commonName:
            type: string
          country:
            type: string
          locality:
            type: string
          org:
            type: string
          orgUnit:
            type: string
          province:
            type: string
        type: object
    type: object
  router.certificateCSRPreviewRequest:
    properties:
      algorithm:
        enum:
        - RSA-2048
        - RSA-4096
        - ECDSA-P256
        - ECDSA-P384
        - ED25519
        type: string
      san:
        items:
          type: string
        type: array
      subject:
        example: CN=api.example.com,O=Acme Corp,C=CN
        type: string
    type: object
  router.certificateCSRPreviewResponse:
    properties:
      csrPEM:
        type: string
      privateKeyPEM:
        type: string
    type: object
  router.certificateListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Certificate'
        type: array
      total:
        type: integer
    type: object
  router.certificateRequest:
    properties:
      algorithm:
        type: string
      caID:
        type: string
      commonName:
        type: string
      csrPEM:
        type: string
      privateKeyPEM:
        type: string
      purpose:
        enum:
        - server
        - client
        - mtls
        type: string
      san:
        items:
          type: string
        type: array
      subject:
        type: string
      validityDays:
        type: integer
    type: object
  router.changePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
    type: object
  router.configurationRequest:
    properties:
      clearConfig:
        type: boolean
      config:
        additionalProperties: {}
        type: object
      enabled:
        type: boolean
      name:
        type: string
    type: object
  router.createCARequest:
    properties:
      algorithm:
        enum:
        - RSA-2048
        - RSA-4096
        - ECDSA-P256
        - ECDSA-P384
        - ED25519
        type: string
      name:
        type: string
      notAfter:
        type: string
      parentId:
        type: string
      subject:
        example: CN=Example CA,O=Example
        type: string
      type:
        enum:
        - root
        - intermediate
        - issuing
        type: string
    type: object
  router.crlListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.CRLEntry'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  router.emailConfigurationRequest:
    properties:
      clearConfig:
        type: boolean
      config:
        additionalProperties: {}
        type: object
      passwordResetEnabled:
        type: boolean
    type: object
  router.emailTestRequest:
    properties:
      to:
        format: email
        type: string
    type: object
  router.errorDocResponse:
    properties:
      message:
        type: string
    type: object
  router.healthResponse:
    properties:
      ok:
        type: boolean
      service:
        type: string
      time:
        type: string
    type: object
  router.importCARequest:
    properties:
      certificatePEM:
        type: string
      csrPEM:
        type: string
      name:
        example: Sunline Root CA
        type: string
      parentId:
        type: string
      privateKeyPEM:
        type: string
      type:
        enum:
        - root
        - intermediate
        - issuing
        type: string
    type: object
  router.listResponse:
    properties:
      items:
        items: {}
        type: array
      total:
        type: integer
    type: object
  router.loginRequest:
    properties:
      password:
        example: change-me
        type: string
      provider:
        example: local
        type: string
      username:
        example: admin
        type: string
    type: object
  router.managedUserRequest:
    properties:
      disabled:
        type: boolean
      displayName:
        type: string
      email:
        type: string
      password:
        type: string
      roleKeys:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  router.notificationChannelRequest:
    properties:
      approvalEnabled:
        type: boolean
      clearConfig:
        type: boolean
      config:
        additionalProperties: {}
        type: object
      passwordResetEnabled:
        type: boolean
    type: object
  router.notificationChannelTestRequest:
    properties:
      to:
        type: string
    type: object
  router.ocspHealthResponse:
    properties:
      enabled:
        type: boolean
      ok:
        type: boolean
    type: object
  router.ocspStatusResponse:
    properties:
      checkedAt:
        example: "2026-07-26 00:59:35"
        type: string
      commonName:
        type: string
      notAfter:
        example: "2027-07-26 00:00:00"
        type: string
      notBefore:
        example: "2026-07-26 00:00:00"
        type: string
      reason:
        example: ocspDisabled
        type: string
      revokedAt:
        example: "2026-07-26 00:12:15"
        type: string
      serialNumber:
        type: string
      status:
        example: good
        type: string
      valid:
        type: boolean
    type: object
  router.passwordResetConfirmRequest:
    properties:
      code:
        type: string
      confirmPassword:
        type: string
      newPassword:
        type: string
      username:
        type: string
      verificationToken:
        type: string
    type: object
  router.passwordResetSendRequest:
    properties:
      channel:
        example: email
        type: string
      username:
        type: string
      verificationToken:
        type: string
      verifyEmail:
        type: string
    type: object
  router.passwordResetVerifyRequest:
    properties:
      captchaAnswer:
        type: string
      captchaToken:
        type: string
      username:
        type: string
    type: object
  router.pkiSettings:
    properties:
      appName:
        type: string
      appSubtitle:
        type: string
      autoRenew:
        type: boolean
      crlEnabled:
        type: boolean
      crlIntervalHours:
        type: integer
      crlUrl:
        type: string
      expiryNotificationCron:
        type: string
      expiryNotificationDays:
        type: integer
      iconData:
        type: string
      loginName:
        type: string
      ocspEnabled:
        type: boolean
      ocspUrl:
        type: string
      passwordResetRateLimitMinutes:
        type: integer
      passwordResetSendCooldownMinutes:
        type: number
      renewDays:
        type: integer
      resetCaptchaTtlMinutes:
        type: integer
      resetCodeTtlMinutes:
        type: integer
      siteName:
        type: string
    type: object
  router.publicAuthProvidersResponse:
    properties:
      items:
        items:
          additionalProperties: {}
          type: object
        type: array
      passwordResetEnabled:
        type: boolean
      total:
        type: integer
    type: object
  router.publicSettingsResponse:
    properties:
      appName:
        type: string
      appSubtitle:
        type: string
      expiryNotificationDays:
        type: integer
      iconData:
        type: string
      loginName:
        type: string
      siteName:
        type: string
    type: object
  router.revokeCertificateRequest:
    properties:
      reason:
        enum:
        - keyCompromise
        - cACompromise
        - affiliationChanged
        - superseded
        - cessationOfOperation
        - unspecified
        type: string
    type: object
  router.roleRequest:
    properties:
      description:
        type: string
      key:
        type: string
      name:
        type: string
      permissions:
        items:
          type: string
        type: array
    type: object
  router.statusResponse:
    properties:
      status:
        type: string
    type: object
  router.userGroupRequest:
    properties:
      description:
        type: string
      disabled:
        type: boolean
      memberIds:
        items:
          type: string
        type: array
      name:
        type: string
      roleKeys:
        items:
          type: string
        type: array
    type: object
  router.userStatusRequest:
    properties:
      disabled:
        type: boolean
    type: object
  router.workflowListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Workflow'
        type: array
      total:
        type: integer
    type: object
  router.workflowUpdateRequest:
    properties:
      reject_reason:
        type: string
      status:
        enum:
        - approved
        - rejected
        type: string
    type: object
info:
  contact: {}
  description: CertFlow 企业内部 PKI 证书生命周期管理平台后端 API，提供认证、CA、证书、CRL、OCSP、审批、审计和系统配置接口。
  title: CertFlow API
  version: "1.0"
paths:
  /api/health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.healthResponse'
      summary: 健康检查
      tags:
      - Health
  /api/v1/audit-logs:
    get:
      parameters:
      - description: 返回数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.auditListResponse'
      security:
      - BearerAuth: []
      summary: 获取审计日志
      tags:
      - Audit
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: LDAP 认证成功但平台未创建同名用户或该用户已禁用时，返回“用户未在平台中启用”。
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 登录
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 注销当前会话
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户
      tags:
      - Auth
  /api/v1/auth/password-reset/captcha:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PasswordResetCaptcha'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 获取找回密码图形验证码
      tags:
      - PasswordReset
  /api/v1/auth/password-reset/confirm:
    post:
      consumes:
      - application/json
      parameters:
      - description: 重置参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.passwordResetConfirmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 确认找回密码
      tags:
      - PasswordReset
  /api/v1/auth/password-reset/send:
    post:
      consumes:
      - application/json
      parameters:
      - description: 验证令牌与媒介
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.passwordResetSendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.statusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 发送找回密码邮件验证码
      tags:
      - PasswordReset
  /api/v1/auth/password-reset/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: 账号和验证码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.passwordResetVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      summary: 校验账号与图形验证码
      tags:
      - PasswordReset
  /api/v1/auth/providers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.publicAuthProvidersResponse'
      summary: 获取登录方式
      tags:
      - Auth
  /api/v1/cas:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.caListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 获取 CA 列表
      tags:
      - CA
    post:
      consumes:
      - application/json
      parameters:
      - description: CA 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.createCARequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CA'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 创建 CA
      tags:
      - CA
  /api/v1/cas/{id}:
    delete:
      parameters:
      - description: CA ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 递归删除未关联证书的 CA 树
      tags:
      - CA
  /api/v1/cas/{id}/certificate:
    get:
      parameters:
      - description: CA ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 获取 CA 证书内容
      tags:
      - CA
  /api/v1/cas/{id}/deletion-check:
    get:
      parameters:
      - description: CA ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.caDeletionCheckResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 检查 CA 树是否可删除
      tags:
      - CA
  /api/v1/cas/{id}/download:
    get:
      parameters:
      - description: CA ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/x-pem-file
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 下载 CA 证书（.crt）
      tags:
      - CA
  /api/v1/cas/import:
    post:
      consumes:
      - application/json
      description: 导入已有 CA 的证书和匹配私钥。服务端校验证书用途、密钥匹配和 CA 信任链，再以应用主密钥加密存储私钥；CSR 可选且仅用于校验，不会持久化。
      parameters:
      - description: CA 导入参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.importCARequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CA'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 导入已有 CA
      tags:
      - CA
  /api/v1/certificates:
    get:
