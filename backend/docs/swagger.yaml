        X.509 序列号及 SHA-256 证书指纹。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/router.certificateListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
      security:
      - BearerAuth: []
      summary: 获取证书列表
      tags:
      - Certificates
    post:
      consumes:
      - application/json
      description: 签发 CA 可选择任意已启用的 Root、Intermediate 或 Issuing CA。Subject 必须包含与通用名称一致的
        CN，字段值可直接包含英文逗号；至少提供一个 DNS 名称或 IP 地址 SAN，国家代码为可选的两位代码；有效期为 1 至 7300 天，且不能超过签发
        CA 的到期日。系统生成模式提交 CSR 和其匹配私钥，私钥将加密保存。成功后返回 REQ:xxxxxxxx 申请编号和计划到期时间，审批通过后将替换为实际
        X.509 序列号与签发到期时间。
      parameters:
      - description: 证书申请
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/router.certificateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Certificate'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/router.errorDocResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/router.errorDocResponse'
